name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'apps/website/**'
            landing:
              - 'apps/landing/**'

  build-website:
    needs: detect-changes
    if: needs.detect-changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, dom, zip
      - name: Install Dependencies
        run: composer install --no-progress
        working-directory: apps/website
      - name: Copy Environment File
        run: cp .env.example .env
        working-directory: apps/website
      - name: Generate Application Key
        run: php artisan key:generate
        working-directory: apps/website
      - name: Run Tests
        run: vendor/bin/pest
        working-directory: apps/website

  build-landing:
    needs: detect-changes
    if: needs.detect-changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/landing/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: apps/landing
      - name: Build
        run: npm run build
        working-directory: apps/landing
