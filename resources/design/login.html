<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress Hub — Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --background: #0a0a0b;
      --card-bg: #141414;
      --card-border: #27272a;
      --card-hover: #1c1c1e;
      --foreground: #fafafa;
      --muted: #a1a1aa;
      --muted-foreground: #a1a1aa;
      --accent: #fafafa;
      --accent-foreground: #18181b;
      --primary: #f4f4f5;
      --primary-foreground: #18181b;
      --border: #27272a;
      --input: #27272a;
      --ring: #d4d4d8;
      --radius: 0.5rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      line-height: 1.6;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 18px;
      color: var(--foreground);
      text-decoration: none;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background-color: var(--foreground);
      color: var(--background);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    main {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px;
    }

    .auth-header {
      margin-bottom: 22px;
    }

    .auth-header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .auth-header p {
      margin-top: 6px;
      font-size: 14px;
      color: var(--muted-foreground);
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      font-weight: 500;
    }

    .field input {
      background-color: var(--background);
      border: 1px solid var(--input);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: var(--foreground);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.15s ease;
    }

    .field input:focus {
      outline: none;
      box-shadow: 0 0 0 2px var(--ring);
      border-color: var(--ring);
    }

    .field input::placeholder {
      color: var(--muted-foreground);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius);
      border: 1px solid var(--input);
      background-color: var(--foreground);
      color: var(--accent-foreground);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--card-hover);
      color: var(--foreground);
      border-color: var(--card-border);
    }

    .btn-secondary:hover {
      background-color: var(--card-border);
    }

    .auth-footer {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--muted-foreground);
    }

    .auth-footer a {
      color: var(--foreground);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-footer a:hover {
      opacity: 0.8;
    }

    .profile {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #3f3f46;
      border: 2px solid var(--card-bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--foreground);
      text-decoration: none;
      margin-left: 8px;
    }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 20px 0;
      text-align: center;
      color: var(--muted-foreground);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="header-inner">
        <a href="home.html" class="logo">
          <div class="logo-icon">P</div>
          Progress Hub
        </a>
        <div style="display:flex;align-items:center;gap:8px;">
          <a href="login.html" class="btn">Login</a>
          <a href="register.html" class="btn btn-secondary">Register</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="auth-card">
      <div class="auth-header">
        <h1>Login</h1>
        <p>Akses progres belajar, proyek, dan kegiatan UKM kamu.</p>
      </div>
      <form class="form" onsubmit="return false;">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="nama@kampus.ac.id" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Masukkan password" />
        </div>
        <button class="btn" type="button" onclick="location.href='dashboard.html'">Login</button>
      </form>
      <div class="auth-footer">
        Belum punya akun? <a href="register.html">Daftar</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>Progress Hub — UKM Dashboard. Dibuat dengan purpose.</p>
    </div>
  </footer>
</body>
</html>
